services:
  api:
    build: .
    container_name: instrumentos-api-dev
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      REPORTS_SERVICE_URL: http://reports:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      reports:
        condition: service_started
    networks:
      - instrumentos-net

  reports:
    build: .
    container_name: instrumentos-reports-dev
    restart: unless-stopped
    command: npm run dev:reports
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      REPORTS_PORT: 3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - instrumentos-net

  postgres:
    image: postgres:16-alpine
    container_name: instrumentos-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: instrumentos
      POSTGRES_PASSWORD: instrumentos123
      POSTGRES_DB: instrumentos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instrumentos -d instrumentos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - instrumentos-net

volumes:
  postgres_data_dev:

networks:
  instrumentos-net:
    driver: bridge
